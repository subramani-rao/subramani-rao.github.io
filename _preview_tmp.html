&lt;style&gt;
  :root{
    --bg:#0b1220;
    --bg-alt:#111a2c;
    --card:#141f36;
    --border:#233152;
    --text:#e8edf7;
    --text-dim:#a7b3c9;
    --accent:#5eb3ff;
    --accent-2:#7ee8c1;
    --radius:14px;
    --maxw:920px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

  nav.topnav{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(11,18,32,0.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  nav.topnav .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:60px;
    max-width:1040px;
  }
  nav.topnav .brand{font-weight:700;color:var(--text);font-size:15px;}
  nav.topnav .brand:hover{text-decoration:none;}
  nav.topnav ul{
    list-style:none;
    display:flex;
    gap:22px;
    margin:0;
    padding:0;
  }
  nav.topnav a.navlink{
    color:var(--text-dim);
    font-size:13.5px;
    font-weight:500;
  }
  nav.topnav a.navlink:hover{color:var(--text);text-decoration:none;}
  nav.topnav .navlinks{overflow-x:auto;scrollbar-width:none;}
  nav.topnav .navlinks::-webkit-scrollbar{display:none;}

  header.hero{
    padding:76px 24px 64px;
    background:
      radial-gradient(600px 300px at 20% -10%, rgba(94,179,255,0.18), transparent 60%),
      radial-gradient(500px 260px at 90% 0%, rgba(126,232,193,0.14), transparent 60%),
      var(--bg);
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  .hero .avatar{
    width:132px;
    height:132px;
    border-radius:50%;
    object-fit:cover;
    margin:0 auto 24px;
    display:block;
    border:3px solid rgba(94,179,255,0.4);
    box-shadow:0 0 0 8px rgba(94,179,255,0.08), 0 12px 30px rgba(0,0,0,0.35);
  }
  .hero .tag{
    display:inline-block;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-2);
    background:rgba(126,232,193,0.08);
    border:1px solid rgba(126,232,193,0.25);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:20px;
  }
  .hero h1{
    font-size:clamp(32px,5vw,48px);
    margin:0 0 10px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .hero .role{
    font-size:19px;
    color:var(--text-dim);
    margin:0 0 28px;
  }
  .hero .links{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .btn{
    padding:10px 20px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--text);
    font-size:14px;
    transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600;}
  .btn.primary:hover{background:#7cc1ff;color:#04101f;}

  main{padding:64px 0 40px;}
  section{margin-bottom:64px;}
  section h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--accent-2);
    margin:0 0 24px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  section h2::after{
    content:&quot;&quot;;
    height:1px;
    flex:1;
    background:var(--border);
  }
  .about p{color:var(--text-dim);font-size:16px;max-width:72ch;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .grid .card:hover{
    transform:translateY(-3px);
    border-color:rgba(94,179,255,0.4);
    box-shadow:0 10px 24px rgba(0,0,0,0.28);
  }

  .timeline{display:flex;flex-direction:column;gap:0;}
  .timeline-item{
    display:grid;
    grid-template-columns:150px 1fr;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid var(--border);
  }
  .timeline-item:last-child{border-bottom:none;}
  .timeline-item .period{color:var(--text-dim);font-size:14px;white-space:nowrap;}
  .timeline-item .role{font-weight:600;font-size:16px;margin:0 0 4px;}
  .timeline-item .org{color:var(--text-dim);font-size:14px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }
  .item-title{font-weight:600;font-size:15.5px;margin:0 0 6px;}
  .item-sub{color:var(--text-dim);font-size:14px;margin:0 0 12px;}
  .item-links{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;}
  .item-links a{
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:6px;
  }
  .item-links a:hover{text-decoration:none;border-color:var(--accent);}

  .award-card{
    background:linear-gradient(135deg, rgba(94,179,255,0.10), rgba(126,232,193,0.06));
    border:1px solid rgba(94,179,255,0.3);
  }
  .award-card .item-title{font-size:18px;}

  .edu-item{padding:16px 0;border-bottom:1px solid var(--border);}
  .edu-item:last-child{border-bottom:none;}

  footer{
    border-top:1px solid var(--border);
    padding:40px 24px 60px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
  }
  footer a{color:var(--text-dim);}

  @media (max-width:600px){
    .timeline-item{grid-template-columns:1fr;gap:4px;}
    nav.topnav ul{gap:16px;}
  }

  &lt;section class=&quot;about&quot; id=&quot;about&quot;&gt;
    &lt;h2&gt;About&lt;/h2&gt;
    &lt;p&gt;
      Subramani Rao is a cybersecurity and product marketing leader specializing in go-to-market strategy,
      product positioning, and driving adoption for cutting-edge security and cyber resilience solutions.
      He focuses on bridging cybersecurity and data protection to help organizations stay resilient against
      evolving threats, with particular depth in ransomware resilience and operational technology (OT) security.
      He is the author of two books on AI and cybersecurity, a CISSP-certified security professional, and a
      recognized voice in industry press and at international conferences.
    &lt;/p&gt;
  &lt;/section&gt;

  &lt;section id=&quot;recognition&quot;&gt;
